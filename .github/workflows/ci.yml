# Проверки для каждого PR и пуша в main: типы, тесты, линтер, сборка фронта и миграции на чистой базе.
# Деплой делает Vercel сам (продакшен — только из main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm ci --prefix web --no-fund --no-audit
      - name: Типы, тесты, линтер
        run: npm run check
      - name: Сборка фронта
        run: npm run build --prefix web
      - name: Миграции на пустой базе
        run: npm run migrate && npm run demo
