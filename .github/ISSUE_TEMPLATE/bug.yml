name: Что-то сломалось
description: Ошибка в журнале, участниках или подключении ассистента
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что делали, что ожидали и что получили.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: "1. Открыл «Новая поездка»\n2. …"
  - type: dropdown
    id: where
    attributes:
      label: Где
      options: [Телефон, Компьютер, Ассистент (MCP)]
  - type: textarea
    id: screens
    attributes:
      label: Скриншоты или текст ошибки
